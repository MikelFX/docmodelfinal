<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#13111e"/>
      <stop offset="100%" stop-color="#08070f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7F77DD" stop-opacity="0"/>
      <stop offset="50%" stop-color="#a89ef5"/>
      <stop offset="100%" stop-color="#7F77DD" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background: rounded square (modern app icon standard) -->
  <rect width="512" height="512" rx="108" fill="url(#bg)"/>

  <!-- DT: bold, tight, centered -->
  <text
    x="256"
    y="316"
    text-anchor="middle"
    font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif"
    font-size="208"
    font-weight="800"
    letter-spacing="-10"
    fill="white"
  >DT</text>

  <!-- Single purple fade-in/out underline accent -->
  <rect x="118" y="348" width="276" height="5" rx="2.5" fill="url(#accent)"/>
</svg>
