<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1830"/>
      <stop offset="100%" style="stop-color:#0d0c1a"/>
    </linearGradient>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9f98f0"/>
      <stop offset="100%" style="stop-color:#6058c4"/>
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="256" cy="256" r="256" fill="url(#bg)"/>

  <!-- Outer ring -->
  <circle cx="256" cy="256" r="220" fill="none" stroke="url(#ring)" stroke-width="6" opacity="0.4"/>

  <!-- Inner glow ring -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#7F77DD" stroke-width="2" opacity="0.2"/>

  <!-- DT text -->
  <text
    x="256"
    y="300"
    text-anchor="middle"
    font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif"
    font-size="160"
    font-weight="700"
    letter-spacing="-8"
    fill="white"
  >DT</text>

  <!-- Subtle bottom label -->
  <text
    x="256"
    y="380"
    text-anchor="middle"
    font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif"
    font-size="36"
    font-weight="300"
    letter-spacing="12"
    fill="#7F77DD"
    opacity="0.8"
  >DOCTHINK</text>
</svg>
